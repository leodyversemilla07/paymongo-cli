name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Validate tag and select publishing channel
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"

      - name: Install locked dependencies and build
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Test the installed npm tarball
        run: npm run test:package

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.metadata.outputs.npm_tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"

      - name: Setup for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://npm.pkg.github.com
          scope: '@leodyversemilla07'

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_DIST_TAG: ${{ steps.metadata.outputs.npm_tag }}
        run: |
          npm pkg set name='@leodyversemilla07/paymongo-cli'
          npm publish --tag "$NPM_DIST_TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
          draft: false
          body: |
            ## Changes
            See [CHANGELOG.md](https://github.com/leodyversemilla07/paymongo-cli/blob/${{ github.ref_name }}/CHANGELOG.md).

            ## Installation
            ```bash
            npm install -g paymongo-cli@${{ steps.metadata.outputs.npm_tag }}
            ```

            Community-built CLI. Checkout commands currently target the documented v1 lifecycle.
